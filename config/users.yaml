# CHI Dashboard — User Access Config
#
# Roles:
#   all    — sees all CSMs, full filter access
#   csm    — sees only their own accounts + team benchmarks; hubspot_name must match
#            their name exactly as it appears in the HubSpot owner list
#   subset — sees a defined list of CSMs; list them under allowed_csms
#
# To add a user: add their @clearlyrated.com email and set role + display_name.
# To remove a user: delete or comment out their entry.

